# 实测 S3 NEFF 缓存命中：RS0 配置（Qwen3-30B，pkg_nj，1 device TP4/LNC2），只用空闲 device；测完删除
apiVersion: v1
kind: Pod
metadata: {name: rs-cache-test, namespace: trn2-perf, labels: {app: neff-cache, role: test}}
spec:
  serviceAccountName: neff-cache
  schedulerName: my-scheduler
  restartPolicy: Never
  nodeSelector: {karpenter.sh/nodepool: trn2-spot, kubernetes.io/hostname: <NODE>}
  tolerations: [{key: aws.amazon.com/neuron, operator: Exists, effect: NoSchedule}]
  containers:
  - name: c
    image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.29.0.1.2.0-neuronx-py314-sdk2.33.0-ubuntu26.04
    imagePullPolicy: IfNotPresent
    command: ["bash", "/tscripts/cc_test.sh"]
    env:
    - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
    - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    resources:
      requests: {aws.amazon.com/neuron: "1", cpu: "8", memory: 160Gi}
      limits: {aws.amazon.com/neuron: "1", cpu: "8", memory: 160Gi}
    volumeMounts:
    - {name: models, mountPath: /data/models, readOnly: true}
    - {name: pkg, mountPath: /pkg/pkg_nj, readOnly: true}
    - {name: work, mountPath: /work}
    - {name: shm, mountPath: /dev/shm}
    - {name: scripts, mountPath: /scripts, readOnly: true}
    - {name: tscripts, mountPath: /tscripts, readOnly: true}
  volumes:
  - {name: models, hostPath: {path: /mnt/k8s-disks/0/trn2-perf/models, type: Directory}}
  - {name: pkg, hostPath: {path: /mnt/k8s-disks/0/trn2-perf/cache/nj_results/pkg_nj, type: Directory}}
  - {name: work, emptyDir: {sizeLimit: 60Gi}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
  - {name: scripts, configMap: {name: neff-cache-scripts}}
  - {name: tscripts, configMap: {name: neff-cache-test}}
